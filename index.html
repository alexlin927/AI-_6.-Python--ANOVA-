<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102643"><title>Python 第六單元｜變異分析 ANOVA</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color-scheme:dark;background:#0c1424;color:#f3f6fb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #71b6ff;outline-offset:2px}.top{display:flex;align-items:center;justify-content:space-between;padding:12px clamp(12px,3vw,32px);gap:12px;background:#15233a;border-bottom:1px solid #31405a}.top h1{font-size:clamp(15px,1.8vw,22px);margin:0;font-weight:700}.top small{display:block;color:#b8c9e2;font-size:12px;margin-top:3px}.actions,.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #455a77;background:#223654;color:white;border-radius:10px;padding:9px 14px}.btn:hover{background:#31527b}.btn.primary{background:#2766aa;border-color:#4486cf}.stage{width:min(calc(100% - 28px),1330px);margin:18px auto 0}.slide-frame{aspect-ratio:16/9;background:#060d1b;border-radius:9px;overflow:hidden;box-shadow:0 12px 40px #0008;border:1px solid #354762;display:flex;align-items:center;justify-content:center}.slide-frame img{display:block;width:100%;height:100%;object-fit:contain}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}.counter{font-weight:650;font-variant-numeric:tabular-nums;color:#d7e4fb}.notes{background:#18283f;border:1px solid #394b64;border-radius:12px;padding:clamp(14px,2.5vw,26px);margin:0 0 30px}.notes h2{font-size:18px;margin:0 0 12px}.notes p{white-space:pre-wrap;line-height:1.85;margin:0;font-size:clamp(15px,1.4vw,19px);color:#e4ecf8}.hidden{display:none!important}.gridview{width:min(1360px,calc(100% - 28px));margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.thumb{padding:7px;background:#1d2b42;border:1px solid #41526e;border-radius:11px;text-align:left;color:white}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:5px}.thumb span{display:block;padding:8px 4px 2px}.thumb:hover{background:#315074}.hint{font-size:12px;color:#adbfdb;text-align:center;padding:3px 12px 24px}body.presentation .top,body.presentation .controls,body.presentation .notes,body.presentation .hint{display:none}body.presentation{background:black}body.presentation .stage{margin:0;width:100vw;max-width:none}body.presentation .slide-frame{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}@media(max-width:670px){.top{flex-direction:column;align-items:stretch}.top .actions{justify-content:center}.controls{justify-content:center;flex-wrap:wrap}.controls .nav{justify-content:center}.counter{order:-1;width:100%;text-align:center}}
</style></head><body><header class="top"><div><h1>Python 第六單元｜變異分析（ANOVA）</h1><small>國立臺灣師範大學・化學系｜16:9 教學投影片與逐頁演講稿</small></div><div class="actions"><button class="btn" id="notesBtn" aria-pressed="false">顯示講稿</button><button class="btn" id="gridBtn" aria-pressed="false">投影片總覽</button><button class="btn primary" id="fullBtn">全螢幕</button></div></header><main><section id="viewer" class="stage"><div class="slide-frame" id="frame"><img id="slideImg" alt="ANOVA 課程投影片第 1 頁" src="slides/slide-01.jpg"></div><div class="controls"><div class="nav"><button class="btn" id="prevBtn">← 上一頁</button><button class="btn" id="nextBtn">下一頁 →</button></div><span class="counter" id="counter">1 / 27</span><div class="nav"><button class="btn" id="jumpFirst">首頁</button><button class="btn" id="jumpLast">末頁</button></div></div><article class="notes hidden" id="notes"><h2 id="noteTitle">第 1 頁・教師演講稿</h2><p id="noteText"></p></article></section><section id="overview" class="gridview hidden" aria-label="投影片總覽"></section></main><p class="hint">鍵盤 ← → 可翻頁，Home / End 跳至首末頁，按 Esc 離開總覽或全螢幕。講稿可逐頁顯示或隱藏。</p><script src="data.js"></script><script>
(()=>{'use strict';const slides=window.SLIDES||[];let index=0,showNotes=false,showGrid=false;const $=id=>document.getElementById(id);const image=$('slideImg'),counter=$('counter'),notes=$('notes'),notesBtn=$('notesBtn'),gridBtn=$('gridBtn'),overview=$('overview'),viewer=$('viewer');function setIndex(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];if(!s)return;image.src=s.image;image.alt='ANOVA 課程投影片第 '+s.number+' 頁';counter.textContent=s.number+' / '+slides.length;$('noteTitle').textContent='第 '+s.number+' 頁・教師演講稿';$('noteText').textContent=s.notes||'本頁未提供講稿';$('prevBtn').disabled=index===0;$('nextBtn').disabled=index===slides.length-1;history.replaceState(null,'','#slide-'+s.number)}function toggleNotes(){showNotes=!showNotes;notes.classList.toggle('hidden',!showNotes);notesBtn.textContent=showNotes?'隱藏講稿':'顯示講稿';notesBtn.setAttribute('aria-pressed',String(showNotes))}function toggleGrid(force){showGrid=typeof force==='boolean'?force:!showGrid;overview.classList.toggle('hidden',!showGrid);viewer.classList.toggle('hidden',showGrid);gridBtn.textContent=showGrid?'返回投影片':'投影片總覽';gridBtn.setAttribute('aria-pressed',String(showGrid));if(showGrid)window.scrollTo(0,0)}for(const s of slides){const b=document.createElement('button');b.className='thumb';const img=document.createElement('img');img.loading='lazy';img.src=s.image;img.alt='第 '+s.number+' 頁縮圖';const label=document.createElement('span');label.textContent='第 '+s.number+' 頁';b.append(img,label);b.addEventListener('click',()=>{setIndex(s.number-1);toggleGrid(false)});overview.appendChild(b)}$('prevBtn').onclick=()=>setIndex(index-1);$('nextBtn').onclick=()=>setIndex(index+1);$('jumpFirst').onclick=()=>setIndex(0);$('jumpLast').onclick=()=>setIndex(slides.length-1);notesBtn.onclick=toggleNotes;gridBtn.onclick=()=>toggleGrid();$('fullBtn').onclick=async()=>{if(document.fullscreenElement){await document.exitFullscreen()}else{try{await document.documentElement.requestFullscreen()}catch(e){document.body.classList.toggle('presentation')}}};document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('presentation',!!document.fullscreenElement);$('fullBtn').textContent=document.fullscreenElement?'退出全螢幕':'全螢幕'});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='Escape'&&showGrid){toggleGrid(false);return}if(showGrid)return;if(e.key==='ArrowLeft'){e.preventDefault();setIndex(index-1)}else if(e.key==='ArrowRight'){e.preventDefault();setIndex(index+1)}else if(e.key==='Home'){e.preventDefault();setIndex(0)}else if(e.key==='End'){e.preventDefault();setIndex(slides.length-1)}});const m=location.hash.match(/^#slide-(\d+)$/);setIndex(m?Number(m[1])-1:0)})();
</script></body></html>
